# Self-test: runs julia-ci.yml from this commit against the fixture package. registered and
# runic are on so the downgrade and Runic jobs run too; the pre job runs only on schedule.
name: Self-test

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  actions: write
  contents: read

jobs:
  fixture:
    uses: ./.github/workflows/julia-ci.yml
    with:
      project: test/fixture/FixturePkg
      registered: true
      runic: true
