# The lab's shared Julia CI. Packages call it from a copy of templates/CI.yml:
#   uses: LidkeLab/.github/.github/workflows/julia-ci.yml@v2
# It runs the Core test group at the oldest supported Julia and the current release, the QA
# group, and (registered packages) the lowest dependency versions the [compat] bounds allow.
# Heavy groups (GPU, Data, Long, Hardware) never run here; they run on a lab machine.
name: Julia CI

on:
  workflow_call:
    inputs:
      registered:
        description: 'The package is registered: adds the downgrade job and the monthly Julia pre run (public repositories).'
        type: boolean
        default: false
      runic:
        description: 'Check formatting with Runic.'
        type: boolean
        default: false
      project:
        description: 'Path to the package, relative to the repository root.'
        type: string
        default: '.'

permissions: {}

env:
  # Precompile for the same CPU targets as the official Julia binaries. The default, native,
  # ties every cached pkgimage to the CPU of the job that saved the cache; GitHub's x64 runners
  # mix AMD EPYC 7763, 9V74 and Intel Xeon 8370C, 8573C, and a job landing on an incompatible
  # one rejects the cache ("different system or CPU target") and rebuilds every dependency.
  JULIA_CPU_TARGET: 'generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1);x86-64-v4,-rdrnd,base(1)'
  # Only the default branch saves Julia caches; PR and other branch runs restore the default
  # branch's cache and save nothing, so they cannot evict it from the 10 GB repository budget.
  # Scheduled runs always run on the default branch, but their event carries no repository.
  # A private repository runs no push event, so only a manual dispatch on main seeds its cache.
  JULIA_CACHE_SAVE: ${{ github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  # Admiral decision 0025: a public repository, whose Actions minutes are free, runs on every event
  # its caller sends. A private one runs only on pull requests and manual dispatch, at Julia 1
  # only: its push and scheduled events skip every job. Push, pull request and dispatch events
  # carry github.event.repository.private; a scheduled event carries no repository, so the
  # visibility job looks it up, on scheduled runs only.
  visibility:
    name: Visibility
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      public: ${{ steps.lookup.outputs.public }}
    steps:
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)
          echo "public=$([ "$visibility" = public ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  test:
    name: Core - Julia ${{ matrix.version }}
    needs: visibility
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && (github.event_name != 'push' || !github.event.repository.private)
      && (github.event_name != 'schedule' || needs.visibility.outputs.public == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60  # a cold portable-target build of a large package runs ~30 min
    permissions:
      actions: write  # julia-actions/cache deletes the caches it replaces
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # A private repository tests Julia 1 only; its floor is checked in the local record.
        version: ${{ fromJSON(github.event.repository.private && '["1"]' || '["min", "1"]') }}
    env:
      GROUP: Core
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: x64
          project: ${{ inputs.project }}
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};cpu=portable
          save-always: ${{ env.JULIA_CACHE_SAVE }}
          _job-status: ${{ env.JULIA_CACHE_SAVE == 'true' && job.status || 'not-saved-off-default-branch' }}
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: ${{ inputs.project }}
      - uses: julia-actions/julia-runtest@v1
        with:
          project: ${{ inputs.project }}
          coverage: 'false'

  qa:
    name: QA
    needs: visibility
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && (github.event_name != 'push' || !github.event.repository.private)
      && (github.event_name != 'schedule' || needs.visibility.outputs.public == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60  # a cold portable-target build of a large package runs ~30 min
    permissions:
      actions: write
      contents: read
    env:
      GROUP: QA
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};cpu=portable
          save-always: ${{ env.JULIA_CACHE_SAVE }}
          _job-status: ${{ env.JULIA_CACHE_SAVE == 'true' && job.status || 'not-saved-off-default-branch' }}
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: ${{ inputs.project }}
      - uses: julia-actions/julia-runtest@v1
        with:
          project: ${{ inputs.project }}
          coverage: 'false'

  downgrade:
    # Direct dependencies at the lowest versions [compat] allows. Weak dependencies are left
    # alone (mode deps): their extensions do not load in Core, and flooring them would install
    # packages such as CUDA for nothing. Public repositories only: it runs at the Julia floor, which
    # a private repository checks in its local record.
    name: Core - lowest compat
    needs: visibility
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && (github.event_name != 'push' || !github.event.repository.private)
      && (github.event_name != 'schedule' || needs.visibility.outputs.public == 'true')
      && inputs.registered && !github.event.repository.private
    runs-on: ubuntu-latest
    timeout-minutes: 60  # a cold portable-target build of a large package runs ~30 min
    permissions:
      actions: write
      contents: read
    env:
      GROUP: Core
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: 'min'
          arch: x64
          project: ${{ inputs.project }}
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};cpu=portable
          save-always: ${{ env.JULIA_CACHE_SAVE }}
          _job-status: ${{ env.JULIA_CACHE_SAVE == 'true' && job.status || 'not-saved-off-default-branch' }}
      - uses: julia-actions/julia-downgrade-compat@v2
        with:
          projects: ${{ inputs.project }}
          mode: deps
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: ${{ inputs.project }}
      - uses: julia-actions/julia-runtest@v1
        with:
          project: ${{ inputs.project }}
          coverage: 'false'
          allow_reresolve: false
          force_latest_compatible_version: false

  pre:
    # Monthly look at the next Julia release; allowed to fail, reported by admiral's sweep.
    name: Core - Julia pre
    needs: visibility
    if: >-
      !cancelled() && inputs.registered
      && github.event_name == 'schedule' && needs.visibility.outputs.public == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60  # a cold portable-target build of a large package runs ~30 min
    continue-on-error: true
    permissions:
      actions: write
      contents: read
    env:
      GROUP: Core
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: pre
          arch: x64
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};cpu=portable
          save-always: ${{ env.JULIA_CACHE_SAVE }}
          _job-status: ${{ env.JULIA_CACHE_SAVE == 'true' && job.status || 'not-saved-off-default-branch' }}
      - uses: julia-actions/julia-buildpkg@v1
        with:
          project: ${{ inputs.project }}
      - uses: julia-actions/julia-runtest@v1
        with:
          project: ${{ inputs.project }}
          coverage: 'false'

  format:
    name: Runic
    needs: visibility
    if: >-
      !cancelled()
      && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
      && (github.event_name != 'push' || !github.event.repository.private)
      && (github.event_name != 'schedule' || needs.visibility.outputs.public == 'true')
      && inputs.runic
    runs-on: ubuntu-latest
    timeout-minutes: 60  # a cold portable-target build of a large package runs ~30 min
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
          arch: x64
      - uses: julia-actions/cache@v3
        with:
          cache-name: julia-cache;workflow=${{ github.workflow }};job=${{ github.job }};cpu=portable
          save-always: ${{ env.JULIA_CACHE_SAVE }}
          _job-status: ${{ env.JULIA_CACHE_SAVE == 'true' && job.status || 'not-saved-off-default-branch' }}
          # Off the default branch nothing is saved (JULIA_CACHE_SAVE); on it, julia-actions/cache
          # never deletes old caches, so deletion would need actions: write for nothing.
          delete-old-caches: 'false'
      - uses: fredrikekre/runic-action@v1
        with:
          version: '1'
